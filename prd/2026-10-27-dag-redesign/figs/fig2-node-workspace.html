<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Fig2 · 节点工作区 · 同板多工件 + 原位交互</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Inter", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
    background: #f7f8fa;
    color: #111;
    padding: 28px 32px 24px;
  }
  .frame {
    max-width: 1040px;
    margin: 0 auto;
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 12px;
    padding: 28px 32px 22px;
    box-shadow: 0 1px 2px rgba(17,17,17,0.04);
  }
  .title { font-size: 15px; font-weight: 650; margin-bottom: 4px; }
  .subtitle { font-size: 12px; color: #6b7280; margin-bottom: 18px; }
  svg { display: block; width: 100%; height: auto; }
  .footer {
    margin-top: 14px;
    display: flex; gap: 18px; flex-wrap: wrap;
    font-size: 11px; color: #4b5563; line-height: 1.45;
  }
  .footer strong { color: #111; font-weight: 600; }
</style>
</head>
<body>
  <div class="frame" id="capture">
    <div class="title">节点工作区 · 同板多图 / PDF（本轮骨架）+ 原位交互（v0.3）</div>
    <div class="subtitle">共享定位只出现一份可编辑 ROI · 下游为只读幽灵叠层 · 全程不打开右侧对话面板</div>

    <svg viewBox="0 0 980 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="节点工作区示意">
      <defs>
        <marker id="arrBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,1.5 L9,5 L0,8.5 Z" fill="#2563eb"/>
        </marker>
        <marker id="arrTeal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,1.5 L9,5 L0,8.5 Z" fill="#0d9488"/>
        </marker>
        <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M0,1.5 L9,5 L0,8.5 Z" fill="#9ca3af"/>
        </marker>
        <pattern id="dotGrid" width="16" height="16" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.8" fill="#e5e7eb"/>
        </pattern>
        <filter id="sh" x="-15%" y="-15%" width="130%" height="130%">
          <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#111" flood-opacity="0.1"/>
        </filter>
      </defs>

      <!-- Infinite board -->
      <rect x="16" y="8" width="700" height="480" rx="12" fill="#fafbfc" stroke="#e5e7eb"/>
      <rect x="16" y="8" width="700" height="480" rx="12" fill="url(#dotGrid)" opacity="0.55"/>
      <text x="32" y="30" font-size="10" font-weight="600" fill="#9ca3af">无限画板 · 当前节点工作区</text>

      <!-- ========== Image 1: 检测图 A (owner of shared ROI) ========== -->
      <g filter="url(#sh)">
        <rect x="40" y="48" width="260" height="200" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
      </g>
      <!-- fake image content -->
      <rect x="40" y="48" width="260" height="28" rx="8" fill="#f3f4f6"/>
      <rect x="40" y="68" width="260" height="8" fill="#f3f4f6"/>
      <text x="52" y="67" font-size="11" font-weight="650" fill="#374151">检测图 A · lot-12</text>
      <rect x="52" y="88" width="236" height="144" rx="4" fill="#eef2ff"/>
      <!-- subtle part silhouette -->
      <ellipse cx="170" cy="155" rx="70" ry="48" fill="#c7d2fe" opacity="0.55"/>
      <rect x="140" y="130" width="60" height="55" rx="4" fill="#a5b4fc" opacity="0.45"/>

      <!-- Shared ROI — editable solid (OWNER) -->
      <rect x="118" y="112" width="104" height="86" rx="3"
            fill="rgba(37,99,235,0.08)" stroke="#2563eb" stroke-width="2.25"/>
      <!-- resize handles -->
      <rect x="114" y="108" width="8" height="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="218" y="108" width="8" height="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="114" y="190" width="8" height="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
      <rect x="218" y="190" width="8" height="8" fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
      <!-- owner badge -->
      <rect x="118" y="98" width="118" height="16" rx="3" fill="#2563eb"/>
      <text x="177" y="109" text-anchor="middle" font-size="9" font-weight="650" fill="#fff">共享定位 ROI · 可编辑</text>
      <text x="177" y="214" text-anchor="middle" font-size="9" fill="#2563eb">owner = node:定位</text>

      <!-- Marker point M1 (selected for bubble) -->
      <circle cx="210" cy="128" r="6" fill="#2563eb" stroke="#fff" stroke-width="2"/>
      <circle cx="210" cy="128" r="10" fill="none" stroke="#2563eb" stroke-width="1.25" opacity="0.45"/>
      <text x="220" y="124" font-size="10" font-weight="600" fill="#111">M1</text>

      <!-- ========== In-place question bubble (select 1 marker) ========== -->
      <g filter="url(#sh)">
        <path d="M218,118 L228,108 L228,78 Q228,70 236,70 L348,70 Q356,70 356,78 L356,118 Q356,126 348,126 L240,126 L228,136 Z"
              fill="#fff" stroke="#2563eb" stroke-width="1.5"/>
      </g>
      <text x="240" y="88" font-size="9" font-weight="600" fill="#6b7280">原位问题草稿</text>
      <text x="240" y="104" font-size="11" fill="#111">这个角点是定位原点吗？</text>
      <rect x="240" y="110" width="48" height="12" rx="3" fill="#2563eb"/>
      <text x="264" y="119" text-anchor="middle" font-size="9" font-weight="650" fill="#fff">确认发送</text>
      <rect x="292" y="110" width="36" height="12" rx="3" fill="#f3f4f6" stroke="#d1d5db"/>
      <text x="310" y="119" text-anchor="middle" font-size="9" fill="#6b7280">编辑</text>
      <!-- callout -->
      <text x="292" y="58" text-anchor="middle" font-size="10" font-weight="600" fill="#2563eb">选 1 标记 → 原位气泡</text>
      <text x="292" y="48" text-anchor="middle" font-size="9" fill="#9ca3af">确认才发 Agent</text>

      <!-- ========== Image 2: 检测图 B with ghost ROI ========== -->
      <g filter="url(#sh)">
        <rect x="340" y="48" width="240" height="200" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
      </g>
      <rect x="340" y="48" width="240" height="28" rx="8" fill="#f3f4f6"/>
      <rect x="340" y="68" width="240" height="8" fill="#f3f4f6"/>
      <text x="352" y="67" font-size="11" font-weight="650" fill="#374151">检测图 B · lot-12</text>
      <rect x="352" y="88" width="216" height="144" rx="4" fill="#ecfdf5"/>
      <ellipse cx="460" cy="155" rx="64" ry="44" fill="#a7f3d0" opacity="0.5"/>

      <!-- Ghost ROI — read-only dashed overlay -->
      <rect x="410" y="112" width="100" height="72" rx="3"
            fill="rgba(13,148,136,0.06)" stroke="#0d9488" stroke-width="1.75" stroke-dasharray="5 3.5"/>
      <rect x="410" y="98" width="100" height="16" rx="3" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="460" y="109" text-anchor="middle" font-size="9" font-weight="600" fill="#0d9488">幽灵叠层 · 只读</text>
      <!-- click-to-jump hint -->
      <text x="460" y="202" text-anchor="middle" font-size="9" fill="#0d9488">点击幽灵 → 跳回共享定位</text>

      <!-- Markers M2 M3 for distance (outside ghost ROI, lower band) -->
      <circle cx="372" cy="210" r="5.5" fill="#111" stroke="#fff" stroke-width="2"/>
      <text x="372" y="202" text-anchor="middle" font-size="10" font-weight="600" fill="#111">M2</text>
      <circle cx="548" cy="210" r="5.5" fill="#111" stroke="#fff" stroke-width="2"/>
      <text x="548" y="202" text-anchor="middle" font-size="10" font-weight="600" fill="#111">M3</text>

      <!-- Distance line between M2-M3 -->
      <line x1="372" y1="210" x2="548" y2="210" stroke="#0d9488" stroke-width="1.75"/>
      <!-- Distance readout chip -->
      <g filter="url(#sh)">
        <rect x="424" y="192" width="72" height="36" rx="6" fill="#fff" stroke="#0d9488" stroke-width="1.5"/>
      </g>
      <text x="460" y="206" text-anchor="middle" font-size="9" fill="#6b7280">测距</text>
      <text x="460" y="220" text-anchor="middle" font-size="12" font-weight="700" fill="#0d9488">12.4 mm</text>

      <!-- Pin as relation edge button -->
      <rect x="508" y="228" width="68" height="16" rx="4" fill="#0d9488"/>
      <text x="542" y="239" text-anchor="middle" font-size="9" font-weight="650" fill="#fff">钉成关系边</text>
      <text x="460" y="42" text-anchor="middle" font-size="10" font-weight="600" fill="#0d9488">选 2 标记 → 测距可读</text>

      <!-- Relation edge annotation (cross-image intent) -->
      <path d="M300,160 C320,200 330,220 340,230"
            fill="none" stroke="#9ca3af" stroke-width="1.25" stroke-dasharray="3 3"
            marker-end="url(#arrGray)" opacity="0.0"/>

      <!-- ========== PDF / screenshot board object ========== -->
      <g filter="url(#sh)">
        <rect x="40" y="280" width="200" height="160" rx="8" fill="#fff" stroke="#d1d5db" stroke-width="1.5"/>
      </g>
      <rect x="40" y="280" width="200" height="24" rx="8" fill="#fef3c7"/>
      <rect x="40" y="296" width="200" height="8" fill="#fef3c7"/>
      <text x="52" y="297" font-size="11" font-weight="650" fill="#92400e">PDF · 工艺规范 p.3</text>
      <!-- fake PDF lines -->
      <rect x="52" y="318" width="176" height="6" rx="2" fill="#e5e7eb"/>
      <rect x="52" y="332" width="150" height="6" rx="2" fill="#e5e7eb"/>
      <rect x="52" y="346" width="168" height="6" rx="2" fill="#e5e7eb"/>
      <rect x="52" y="360" width="120" height="6" rx="2" fill="#e5e7eb"/>
      <rect x="52" y="380" width="176" height="40" rx="3" fill="#fff7ed" stroke="#fed7aa"/>
      <text x="140" y="398" text-anchor="middle" font-size="10" fill="#9a3412">公差表截图区</text>
      <text x="140" y="412" text-anchor="middle" font-size="9" fill="#b45309">±0.05 mm</text>

      <!-- ========== Sticky note (optional) ========== -->
      <g filter="url(#sh)">
        <rect x="260" y="300" width="130" height="90" rx="4" fill="#fef9c3" stroke="#fde047"/>
      </g>
      <text x="272" y="322" font-size="10" font-weight="650" fill="#854d0e">便签</text>
      <text x="272" y="340" font-size="10" fill="#713f12">lot-12 共用</text>
      <text x="272" y="354" font-size="10" fill="#713f12">同一上游定位</text>
      <text x="272" y="368" font-size="10" fill="#713f12">勿复制 ROI</text>

      <!-- Cross-image relation edge (intent, not step strip) -->
      <path d="M300,248 C320,268 360,280 410,280"
            fill="none" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="4 3"
            marker-end="url(#arrBlue)"/>
      <rect x="318" y="252" width="72" height="16" rx="3" fill="#eff6ff"/>
      <text x="354" y="263" text-anchor="middle" font-size="9" font-weight="600" fill="#2563eb">意图关系边</text>
      <text x="354" y="278" text-anchor="middle" font-size="9" fill="#6b7280">跨图仅关系 / 测距</text>

      <!-- Anti: no step strip -->
      <text x="260" y="420" font-size="10" fill="#9ca3af">✗ 禁止拖成线性步骤条</text>

      <!-- ========== Right legend / rules panel ========== -->
      <rect x="740" y="8" width="220" height="480" rx="12" fill="#fff" stroke="#e5e7eb"/>
      <text x="756" y="34" font-size="12" font-weight="650" fill="#111">交互规则</text>

      <rect x="756" y="48" width="188" height="70" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
      <text x="768" y="68" font-size="11" font-weight="650" fill="#2563eb">① 共享定位</text>
      <text x="900" y="68" font-size="9" font-weight="700" fill="#15803d">本轮</text>
      <text x="768" y="84" font-size="10" fill="#1e3a8a">一份可编辑实线 ROI</text>
      <text x="768" y="98" font-size="10" fill="#1e3a8a">owner = nodeId</text>
      <text x="768" y="110" font-size="10" fill="#1e3a8a">禁止两份可拖框</text>

      <rect x="756" y="130" width="188" height="58" rx="8" fill="#f0fdfa" stroke="#99f6e4"/>
      <text x="768" y="150" font-size="11" font-weight="650" fill="#0d9488">② 下游幽灵</text>
      <text x="900" y="150" font-size="9" font-weight="700" fill="#15803d">本轮</text>
      <text x="768" y="166" font-size="10" fill="#134e4a">只读虚线叠层</text>
      <text x="768" y="180" font-size="10" fill="#134e4a">点击跳回共享节点</text>

      <rect x="756" y="200" width="188" height="70" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="768" y="220" font-size="11" font-weight="650" fill="#111">③ 原位气泡</text>
      <text x="900" y="220" font-size="9" font-weight="700" fill="#b45309">v0.3</text>
      <text x="768" y="236" font-size="10" fill="#4b5563">选 1 标记 → 可编辑草稿</text>
      <text x="768" y="250" font-size="10" fill="#4b5563">确认才发 Agent</text>
      <text x="768" y="264" font-size="10" fill="#4b5563">不靠右侧对话主路径</text>

      <rect x="756" y="282" width="188" height="58" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
      <text x="768" y="302" font-size="11" font-weight="650" fill="#111">④ 测距控件</text>
      <text x="900" y="302" font-size="9" font-weight="700" fill="#b45309">v0.3</text>
      <text x="768" y="318" font-size="10" fill="#4b5563">选 2 标记 → 读数</text>
      <text x="768" y="332" font-size="10" fill="#4b5563">可钉成意图关系边</text>

      <!-- Big callout -->
      <rect x="756" y="358" width="188" height="56" rx="8" fill="#fef2f2" stroke="#fecaca"/>
      <text x="850" y="382" text-anchor="middle" font-size="11" font-weight="700" fill="#991b1b">验收口径</text>
      <text x="850" y="400" text-anchor="middle" font-size="10" fill="#7f1d1d">全程不打开右侧对话面板</text>

      <text x="850" y="440" text-anchor="middle" font-size="10" fill="#6b7280">同板 ≥2 图 + ≥1 PDF</text>
      <text x="850" y="456" text-anchor="middle" font-size="10" fill="#6b7280">标记绑图像坐标</text>
      <text x="850" y="472" text-anchor="middle" font-size="10" fill="#6b7280">缩放平移不丢</text>

      <!-- Bottom board caption -->
      <text x="366" y="510" text-anchor="middle" font-size="11" fill="#4b5563">
        共享定位空间上只出现一份 · 跨图仅通过关系边 / 测距连接 · 非步骤条
      </text>
      <text x="366" y="530" text-anchor="middle" font-size="11" fill="#4b5563">
        AI 动作长在画布选区上（参考 Miro Intelligent Canvas）· 不聊天搬运
      </text>
    </svg>

    <div class="footer">
      <div><strong>本轮骨架（必过）：</strong>同板 ≥2 图 + PDF；可编辑 ROI=1；下游只读幽灵叠层（点幽灵跳回共享源）。</div>
      <div><strong>v0.3 打磨（勿本轮误收）：</strong>原位气泡草稿/确认发送；测距读数与钉成意图关系边的完整人核验。</div>
      <div><strong>图中③④与气泡/测距控件</strong> = 目标态示意，非本轮验收完成条件。</div>
    </div>
  </div>
</body>
</html>
