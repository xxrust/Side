<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="連通區工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>連通區工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 連通區 · 何時不能相信結果</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >斜角接觸</text><g transform="translate(35,83)"><rect x="63" y="15" width="55" height="55" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="120" y="15" width="55" height="55" rx="1" fill="#213441" stroke="#456471"/><rect x="63" y="72" width="55" height="55" rx="1" fill="#213441" stroke="#456471"/><rect x="120" y="72" width="55" height="55" rx="1" fill="#e8f3e9" stroke="#456471"/><text x="45" y="157" fill="#e4f1ec" font-size="16" >四鄰接：兩個區塊</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >人看似相接，算法仍視為分開</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >背景也能通過</text><g transform="translate(350,83)"><rect x="20" y="20" width="210" height="104" rx="9" fill="#78bddd" stroke="#456471"/><rect x="85" y="47" width="68" height="47" rx="1" fill="#b9ced1" stroke="#acc3ce"/><rect x="100.64" y="59.69" width="30.6" height="19.74" rx="1" fill="#10212b" stroke="#10212b"/><text x="20" y="157" fill="#f4b362" font-size="16" >大而連通 ≠ 就是工件</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >符合面積與跨度只代表通過工程篩選</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >核對本圖，再確認</text><g transform="translate(665,83)"><rect x="7" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="23" fill="#91edbd" font-size="13" >比較被拒與通過的區塊</text><rect x="7" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="69" fill="#91edbd" font-size="13" >必要時改閾值／改極性</text><rect x="7" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#f4b362"/><text x="19" y="115" fill="#f4b362" font-size="13" >人工確認工件身分</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >不能從面積排序推導語義正確率</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>