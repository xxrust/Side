<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="找線工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>找線工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 找線 · 輸入 → 方法 → 輸出</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >① 在意圖附近搜尋</text><g transform="translate(35,83)"><rect x="10" y="47" width="235" height="65" rx="0" fill="#203e47" stroke="#f4b362"/><line x1="10" y1="79" x2="245" y2="79" stroke="#f4b362" stroke-width="1" stroke-dasharray="5 4"/><line x1="14" y1="54" x2="240" y2="54" stroke="#acc3ce" stroke-width="3" /><line x1="14" y1="88" x2="240" y2="86" stroke="#91edbd" stroke-width="3" /><line x1="14" y1="107" x2="240" y2="107" stroke="#acc3ce" stroke-width="3" /></g><text x="34" y="261" fill="#acc3ce" font-size="12" >橙帶限定搜尋，不在全背景任意找</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >② 檢查支持與擬合</text><g transform="translate(350,83)"><line x1="10" y1="72" x2="240" y2="76" stroke="#91edbd" stroke-width="2" /><circle cx="13" cy="77" r="3" fill="#78bddd" /><line x1="13" y1="74" x2="13" y2="77" stroke="#f4b362" stroke-width="2" /><circle cx="32" cy="68" r="3" fill="#78bddd" /><line x1="32" y1="74" x2="32" y2="68" stroke="#f4b362" stroke-width="2" /><circle cx="49" cy="80" r="3" fill="#78bddd" /><line x1="49" y1="74" x2="49" y2="80" stroke="#f4b362" stroke-width="2" /><circle cx="75" cy="74" r="3" fill="#78bddd" /><line x1="75" y1="74" x2="75" y2="74" stroke="#f4b362" stroke-width="2" /><circle cx="98" cy="71" r="3" fill="#78bddd" /><line x1="98" y1="74" x2="98" y2="71" stroke="#f4b362" stroke-width="2" /><circle cx="119" cy="80" r="3" fill="#78bddd" /><line x1="119" y1="74" x2="119" y2="80" stroke="#f4b362" stroke-width="2" /><circle cx="143" cy="74" r="3" fill="#78bddd" /><line x1="143" y1="74" x2="143" y2="74" stroke="#f4b362" stroke-width="2" /><circle cx="180" cy="71" r="3" fill="#78bddd" /><line x1="180" y1="74" x2="180" y2="71" stroke="#f4b362" stroke-width="2" /><circle cx="207" cy="77" r="3" fill="#78bddd" /><line x1="207" y1="74" x2="207" y2="77" stroke="#f4b362" stroke-width="2" /><circle cx="230" cy="74" r="3" fill="#78bddd" /><line x1="230" y1="74" x2="230" y2="74" stroke="#f4b362" stroke-width="2" /><text x="16" y="131" fill="#e4f1ec" font-size="14" >有多少支持點？是否連續？</text><text x="16" y="158" fill="#e4f1ec" font-size="14" >偏離直線多遠（RMS）？</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >低殘差只是其中一個條件</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >③ 通過後再比較位置</text><g transform="translate(665,83)"><rect x="5" y="4" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="17" y="24" fill="#91edbd" font-size="13" >覆蓋／連續性／殘差均通過</text><text x="10" y="83" fill="#e4f1ec" font-size="16" >離意圖更近 → 優先候選</text><text x="10" y="125" fill="#f4b362" font-size="15" >多條太接近 → UNKNOWN</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >可人工點選，選擇會記入新方案</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>