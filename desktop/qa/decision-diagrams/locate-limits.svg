<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="模板定位工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>模板定位工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 模板定位 · 何時不能相信結果</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >兩個相似目標</text><g transform="translate(35,83)"><rect x="8" y="22" width="90" height="75" rx="1" fill="#b9ced1" stroke="#acc3ce"/><rect x="28.7" y="42.25" width="40.5" height="31.5" rx="1" fill="#10212b" stroke="#10212b"/><rect x="145" y="68" width="90" height="75" rx="1" fill="#b9ced1" stroke="#acc3ce"/><rect x="165.7" y="88.25" width="40.5" height="31.5" rx="1" fill="#10212b" stroke="#10212b"/></g><text x="34" y="261" fill="#acc3ce" font-size="12" >兩處可能都產生高分</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >最高分不一定可靠</text><g transform="translate(350,83)"><path d="M 8 143 L 46 140 L 73 28 L 102 141 L 154 140 L 181 31 L 216 142 L 245 143" fill="none" stroke="#f4b362" stroke-width="3"/><text x="56" y="20" fill="#e4f1ec" font-size="15" >.97</text><text x="166" y="23" fill="#e4f1ec" font-size="15" >.96</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >示例峰差太小 → 拒絕唯一定位</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >本版未單獨檢出這些變化</text><g transform="translate(665,83)"><text x="7" y="36" fill="#f4b362" font-size="20" >旋轉 / 縮放 / 遮擋</text><text x="7" y="89" fill="#e4f1ec" font-size="17" >也可能碰巧通過門檻</text><text x="7" y="139" fill="#e4f1ec" font-size="16" >請用獨立圖片與人工複核</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >沒有第二候選也不是唯一性證明</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>