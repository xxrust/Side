<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>AgentCV 圖解核對</title><style>body{background:#10212b;color:#e4f1ec;font:14px system-ui;margin:0;display:grid;grid-template-rows:60px 1fr 40px;height:100vh}header{display:flex;gap:14px;align-items:center;padding:0 24px}select,button{background:#203b46;color:inherit;padding:9px;border:1px solid #5a7883}object{width:100%;height:100%;min-height:0}footer{padding:8px 24px;color:#acc3ce}</style><header><strong>SVG 圖解核對</strong><select id="pages"><option>actual-connectivity.svg</option><option>actual-filter.svg</option><option>actual-gray.svg</option><option>actual-hull.svg</option><option>actual-ranking.svg</option><option>actual-sampling.svg</option><option>actual-turn.svg</option><option>binary-limits.svg</option><option>binary-overview.svg</option><option>binary-parameters.svg</option><option>components-limits.svg</option><option>components-overview.svg</option><option>components-parameters.svg</option><option>decide-limits.svg</option><option>decide-overview.svg</option><option>decide-parameters.svg</option><option>edges-limits.svg</option><option>edges-overview.svg</option><option>edges-parameters.svg</option><option>gray-limits.svg</option><option>gray-overview.svg</option><option>gray-parameters.svg</option><option>hull-limits.svg</option><option>hull-overview.svg</option><option>hull-parameters.svg</option><option>locate-limits.svg</option><option>locate-overview.svg</option><option>locate-parameters.svg</option><option>measure-limits.svg</option><option>measure-overview.svg</option><option>measure-parameters.svg</option><option>original-limits.svg</option><option>original-overview.svg</option><option>original-parameters.svg</option><option>template-limits.svg</option><option>template-overview.svg</option><option>template-parameters.svg</option></select><button id="prev">←</button><button id="next">→</button></header><object id="view" type="image/svg+xml"></object><footer>actual-*：使用者原圖實算；其他：工具教學示意。此頁不是原生視窗截圖。</footer><script>const p=document.getElementById('pages'),v=document.getElementById('view');function show(){v.data=p.value}p.onchange=show;document.getElementById('prev').onclick=()=>{p.selectedIndex=Math.max(0,p.selectedIndex-1);show()};document.getElementById('next').onclick=()=>{p.selectedIndex=Math.min(p.options.length-1,p.selectedIndex+1);show()};p.value='actual-filter.svg';show();</script></html>
