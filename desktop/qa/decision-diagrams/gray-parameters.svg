<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="灰階與採樣工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>灰階與採樣工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 灰階與採樣 · 參數從哪裡來</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >固定轉換約定</text><g transform="translate(35,83)"><text x="10" y="40" fill="#ed8e8e" font-size="22" >R × .299</text><text x="10" y="85" fill="#91edbd" font-size="22" >G × .587</text><text x="10" y="130" fill="#78bddd" font-size="22" >B × .114</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >權重不是從本圖學得</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >自動速度策略</text><g transform="translate(350,83)"><text x="5" y="28" fill="#e4f1ec" font-size="19" >s = ceil(最長邊 / 400)</text><text x="5" y="76" fill="#e4f1ec" font-size="20" >至少為 1</text><line x1="120" y1="92" x2="120" y2="120" stroke="#91edbd" stroke-width="2" /><path d="M 116.08531019299893 111.89597607882591 L 120 120 L 123.91468980700107 111.89597607882591" fill="none" stroke="#91edbd" stroke-width="2"/><text x="10" y="151" fill="#f4b362" font-size="18" >400 = 工程預設</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >沒有自動證明它是最佳採樣間隔</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >可手動試調</text><g transform="translate(665,83)"><text x="10" y="37" fill="#91edbd" font-size="22" >s = 1</text><text x="116" y="37" fill="#f4b362" font-size="22" >s = 4</text><rect x="10" y="58" width="21" height="21" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="33" y="58" width="21" height="21" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="56" y="58"