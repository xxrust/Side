<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="模板定位工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>模板定位工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 模板定位 · 參數從哪裡來</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >本版預設門檻</text><g transform="translate(35,83)"><rect x="7" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="23" fill="#91edbd" font-size="13" >ZNCC ≥ 0.90</text><rect x="7" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="69" fill="#91edbd" font-size="13" >MAE ≤ 24 灰階</text><rect x="7" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="115" fill="#91edbd" font-size="13" >峰差 ≥ 0.035</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >目前方案高級參數可覆蓋</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >三者是 AND</text><g transform="translate(350,83)"><text x="8" y="39" fill="#e4f1ec" font-size="17" >相關通過</text><text x="8" y="81" fill="#ef9692" font-size="17" >誤差未過</text><text x="8" y="123" fill="#e4f1ec" font-size="17" >峰差通過</text><line x1="142" y1="80" x2="180" y2="80" stroke="#f4b362" stroke-width="2" /><path d="M 171.8959760788259 83.91468980700107 L 180 80 L 171.8959760788259 76.08531019299893" fill="none" stroke="#f4b362" stroke-width="2"/><text x="182" y="88" fill="#f4b362" font-size="19" >拒絕</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >一個漂亮分數不能替代全部條件</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >用圖集驗證適用範圍</text><g transform="translate(665,83)"><line x1="15" y1="143" x2="243" y2="143" stroke="#acc3ce" stroke-width="2" /><circle cx="25" cy="120" r="5" fill="#ef9692" /><circle cx="49" cy="108" r="5" fill="#ef9692" /><circle cx="85" cy="96" r="5" fill="#91edbd" /><circle cx="140" cy="84" r="5" fill="#91edbd" /><circle cx="165" cy="72" r="5" fill="#91edbd" /><circle cx="214" cy="60" r="5" fill="#91edbd" /><text x="5" y="23" fill="#e4f1ec" font-size="16" >正確 / 錯誤樣本分數分布</text><text x="8" y="163" fill="#e4f1ec" font-size="13" >需要人工真值，不能當通用保證</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >預設值未由目前圖片集自動校準</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>