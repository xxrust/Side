<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="規則判定工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>規則判定工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 規則判定 · 參數從哪裡來</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >上下限由人提供</text><g transform="translate(35,83)"><text x="16" y="35" fill="#e4f1ec" font-size="20" >規格文件 / 工程要求</text><line x1="125" y1="52" x2="125" y2="90" stroke="#91edbd" stroke-width="2" /><path d="M 121.08531019299893 81.89597607882591 L 125 90 L 128.91468980700108 81.89597607882591" fill="none" stroke="#91edbd" stroke-width="2"/><text x="16" y="126" fill="#91edbd" font-size="19" >人確認單位與上下限</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >算法不能自行猜正式公差</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >量測與規格單位一致</text><g transform="translate(350,83)"><text x="8" y="40" fill="#91edbd" font-size="17" >10.02 mm ↔ 9.90–10.10 mm</text><text x="8" y="104" fill="#ef9692" font-size="19" >320 px ↔ 10 mm</text><text x="8" y="151" fill="#e4f1ec" font-size="16" >不可混用單位直接比較</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >無有效標定時，毫米結果為 UNKNOWN</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >驗證真值另存</text><g transform="translate(665,83)"><rect x="7" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="23" fill="#91edbd" font-size="13" >人工答案：你預先知道的結果</text><rect x="7" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#78bddd"/><text x="19" y="69" fill="#78bddd" font-size="13" >算法結果：本次計算輸出</text><rect x="7" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#f4b362"/><text x="19" y="115" fill="#f4b362" font-size="13" >比較兩者：漏檢／誤拒</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >不能讓 Agent 自己生驗收答案</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>