<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="原圖輸入工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>原圖輸入工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 原圖輸入 · 何時不能相信結果</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >指紋相同</text><g transform="translate(35,83)"><rect x="30" y="10" width="180" height="110" rx="2" fill="#b9ced1" stroke="#e4f1ec"/><rect x="71.4" y="37.5" width="77.4" height="44" rx="0" fill="#10212b" stroke="#456471"/></g><text x="34" y="261" fill="#acc3ce" font-size="12" >表示像素輸入相同</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >畫面可能有多個物件</text><g transform="translate(350,83)"><rect x="8" y="20" width="90" height="72" rx="1" fill="#b9ced1" stroke="#acc3ce"/><rect x="28.7" y="39.44" width="40.5" height="30.24" rx="1" fill="#10212b" stroke="#10212b"/><rect x="140" y="65" width="90" height="72" rx="1" fill="#b9ced1" stroke="#acc3ce"/><rect x="160.7" y="84.44" width="40.5" height="30.24" rx="1" fill="#10212b" stroke="#10212b"/></g><text x="349" y="261" fill="#acc3ce" font-size="12" >指紋不提供工件語義</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >需要人工確認</text><g transform="translate(665,83)"><rect x="5" y="9" width="110" height="97" rx="9" fill="none" stroke="#91edbd"/><text x="9" y="147" fill="#e4f1ec" font-size="14" >圈選並確認要檢查哪個物件</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >這是人與 Agent 協作的輸入</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>