<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="凸包工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>凸包工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 凸包 · 何時不能相信結果</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >缺口本來存在</text><g transform="translate(35,83)"><polygon points="25.00,25.00 225.00,25.00 225.00,60.00 135.00,60.00 135.00,109.00 225.00,109.00 225.00,145.00 25.00,145.00" fill="#91edbd" stroke="#91edbd" stroke-width="2" /><text x="146" y="92" fill="#ef9692" font-size="15" >缺口</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >原始缺陷在像素上仍存在</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >凸包把它包住</text><g transform="translate(350,83)"><rect x="25" y="25" width="200" height="120" rx="0" fill="#f4b362" stroke="#f4b362"/><polygon points="25.00,25.00 225.00,25.00 225.00,60.00 135.00,60.00 135.00,109.00 225.00,109.00 225.00,145.00 25.00,145.00" fill="#91edbd" stroke="#91edbd" stroke-width="2" /><text x="146" y="92" fill="#10212b" font-size="13" >被填入</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >不代表缺口合格或已消失</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >凸包只作搜尋範圍</text><g transform="translate(665,83)"><rect x="7" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="23" fill="#91edbd" font-size="13" >原區塊與新增範圍分色</text><rect x="7" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#f4b362"/><text x="19" y="69" fill="#f4b362" font-size="13" >精密輪廓需其他方法</text><rect x="7" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#ef9692"/><text x="19" y="115" fill="#ef9692" font-size="13" >不能拿凸包做凹口缺陷判定</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >幾何可正確，語義仍可能不適用</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>