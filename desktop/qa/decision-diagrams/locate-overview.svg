<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="模板定位工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>模板定位工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 模板定位 · 輸入 → 方法 → 輸出</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >① 模板與待測圖片</text><g transform="translate(35,83)"><rect x="2" y="28" width="73" height="59" rx="1" fill="#b9ced1" stroke="#acc3ce"/><rect x="18.79" y="43.93" width="32.85" height="24.779999999999998" rx="1" fill="#10212b" stroke="#10212b"/><line x1="83" y1="57" x2="113" y2="57" stroke="#91edbd" stroke-width="2" /><path d="M 104.89597607882591 60.914689807001075 L 113 57 L 104.89597607882591 53.085310192998925" fill="none" stroke="#91edbd" stroke-width="2"/><rect x="128" y="5" width="115" height="135" rx="9" fill="#192f3b" stroke="#456471"/><rect x="153" y="52" width="60" height="49" rx="1" fill="#b9ced1" stroke="#acc3ce"/><rect x="166.8" y="65.23" width="27" height="20.58" rx="1" fill="#10212b" stroke="#10212b"/></g><text x="34" y="261" fill="#acc3ce" font-size="12" >目前要求同解析度、只搜尋平移</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >② 搜尋多個位置峰</text><g transform="translate(350,83)"><path d="M 5 143 L 45 141 L 66 83 L 86 139 L 132 139 L 163 21 L 191 140 L 240 142" fill="none" stroke="#78bddd" stroke-width="3"/><circle cx="163" cy="21" r="5" fill="#91edbd" /><text x="165" y="13" fill="#91edbd" font-size="13" >最佳</text><text x="45" y="74" fill="#f4b362" font-size="13" >次佳</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >粗搜尋後精修最多 5 個分離位置</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >