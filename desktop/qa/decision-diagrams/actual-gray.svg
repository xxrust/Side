<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="本圖 RGB 像素灰階貢獻分解" data-diagram-kind="actual" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>本圖 RGB 像素灰階貢獻分解</title><rect width="960" height="420" fill="#10212b"/><text x="24" y="33" fill="#91edbd" font-size="19" >本圖像素 (1132, 824) · 白底合成後 RGB → 灰階</text><text x="30" y="96" fill="#ed8e8e" font-size="19" >紅 R</text><rect x="110" y="70" width="190" height="43" rx="9" fill="rgb(103,0,0)" stroke="#456471"/><text x="322" y="96" fill="#e4f1ec" font-size="21" >103 × 0.299 = 30.797</text><rect x="620" y="73" width="32.608588235294114" height="29" rx="2" fill="#ed8e8e" stroke="#ed8e8e"/><text x="30" y="179" fill="#91edbd" font-size="19" >綠 G</text><rect x="110" y="153" width="190" height="43" rx="9" fill="rgb(0,103,0)" stroke="#456471"/><text x="322" y="179" fill="#e4f1ec" font-size="21" >103 × 0.587 = 60.461</text><rect x="620" y="156" width="64.01752941176471" height="29" rx="2" fill="#91edbd" stroke="#91edbd"/><text x="30" y="262" fill="#78bddd" font-size="19" >藍 B</text><rect x="110" y="236" width="190" height="43" rx="9" fill="rgb(0,0,103)" stroke="#456471"/><text x="322" y="262" fill="#e4f1ec" font-size="21" >103 × 0.114 = 11.742</text><rect x="620" y="239" width="12.432705882352941" height="29" rx="2" fill="#78bddd" stroke="#78bddd"/><line x1="312" y1="300" x2="906" y2="300" stroke="#acc3ce" stroke-width="2" /><text x="322" y="335" fill="#91edbd" font-size="23" >相加 103.000 → 取整 103</text><rect x="723" y="318" width="180" height="44" rx="9" fill="rgb(103,103,103)" stroke="#456471"/><text x="30" y="391" fill="#acc3ce" font-size="15" >權重來源：固定轉換約定；不是本圖學得，也沒有在此證明灰階比彩色更適合任務。</text></svg>