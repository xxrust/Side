<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="閾值分割工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>閾值分割工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 閾值分割 · 參數從哪裡來</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >自動由曲線求出</text><g transform="translate(35,83)"><path d="M 10 137 Q 80 0 125 22 Q 185 25 240 137" fill="none" stroke="#f4b362" stroke-width="3"/><line x1="125" y1="14" x2="125" y2="140" stroke="#91edbd" stroke-width="2" /><text x="136" y="48" fill="#91edbd" font-size="16" >最大值</text><text x="45" y="161" fill="#e4f1ec" font-size="14" >同樣最大 → 取最早 T</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >本圖重新計算，不是固定 64</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >手動覆蓋</text><g transform="translate(350,83)"><text x="10" y="35" fill="#e4f1ec" font-size="19" >直接改 T 或點曲線</text><rect x="35" y="58" width="165" height="48" rx="9" fill="#192f3b" stroke="#456471"/><text x="67" y="89" fill="#91edbd" font-size="24" >T = 100</text><text x="12" y="147" fill="#e4f1ec" font-size="16" >切為手動，可恢復 Otsu</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >本圖立即重算，尚未自動採用範圍</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >極性控制白色條件</text><g transform="translate(665,83)"><text x="8" y="35" fill="#e4f1ec" font-size="18" >亮前景：Y &gt; T → 白</text><text x="8" y="81" fill="#e4f1ec" font-size="18" >暗前景：Y ≤ T → 白</text><text x="8" y="133" fill="#f4b362" font-size="15" >白格數 = 遮罩實算輸出</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >條件由極性推導，格數是唯讀</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>