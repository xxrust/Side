<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="找線工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>找線工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 找線 · 何時不能相信結果</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >背景線也很直</text><g transform="translate(35,83)"><line x1="10" y1="42" x2="243" y2="42" stroke="#ef9692" stroke-width="4" /><line x1="10" y1="100" x2="243" y2="102" stroke="#91edbd" stroke-width="3" /><text x="30" y="30" fill="#ef9692" font-size="15" >背景</text><text x="30" y="134" fill="#91edbd" font-size="15" >工件邊</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >背景線的殘差甚至可能更低</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >幾何合格 ≠ 意圖正確</text><g transform="translate(350,83)"><rect x="7" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="23" fill="#91edbd" font-size="13" >覆蓋通過</text><rect x="7" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="69" fill="#91edbd" font-size="13" >殘差通過</text><rect x="7" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#ef9692"/><text x="19" y="115" fill="#ef9692" font-size="13" >卻選到背景</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >必須同時核對位置與真實圖像</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >用 ROI 與人選消歧義</text><g transform="translate(665,83)"><rect x="5" y="77" width="240" height="50" rx="0" fill="none" stroke="#f4b362"/><line x1="10" y1="42" x2="243" y2="42" stroke="#ef9692" stroke-width="4" /><line x1="10" y1="100" x2="243" y2="102" stroke="#91edbd" stroke-width="3" /><text x="17" y="157" fill="#e4f1ec" font-size="14" >縮小搜尋帶 / 點選真正候選</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >選擇記錄後仍需重新跑圖集</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>