<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="原圖輸入工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>原圖輸入工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 原圖輸入 · 輸入 → 方法 → 輸出</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >① 導入原圖</text><g transform="translate(35,83)"><rect x="30" y="10" width="180" height="110" rx="2" fill="#b9ced1" stroke="#e4f1ec"/><rect x="71.4" y="37.5" width="77.4" height="44" rx="0" fill="#10212b" stroke="#456471"/><text x="45" y="145" fill="#e4f1ec" font-size="15" >像素內容保持原樣</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >圖片與成像配置分開保存</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >② 綁定這一份輸入</text><g transform="translate(350,83)"><rect x="12" y="15" width="225" height="57" rx="9" fill="#192f3b" stroke="#456471"/><text x="27" y="49" fill="#e4f1ec" font-size="19" >寬 × 高 · SHA-256</text><line x1="125" y1="80" x2="125" y2="109" stroke="#91edbd" stroke-width="2" /><path d="M 121.08531019299893 100.89597607882591 L 125 109 L 128.91468980700108 100.89597607882591" fill="none" stroke="#91edbd" stroke-width="2"/><text x="25" y="140" fill="#e4f1ec" font-size="13" >指紋不同 → 不是同一像素輸入</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >指紋追溯檔案，無法辨識工件</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >③ 顯示與計算</text><g transform="translate(665,83)"><rect x="15" y="0" width="36" height="36" rx="1" fill="#213441" stroke="#456471"/><rect x="53" y="0" width="36" height="36" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="91" y="0" width="36" height="36" rx="1" fill="#213441" stroke="#456471"/><rect x="15" y="38" width="36" height="36" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="53" y="38" width="36" height="36" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="91" y="38" width="36" height="36" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="15" y="76" width="36" height="36" rx="1" fill="#213441" stroke="#456471"/><rect x="53" y="76" width="36" height="36" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="91" y="76" width="36" height="36" rx="1" fill="#213441" stroke="#456471"/><line x1="139" y1="56" x2="163" y2="56" stroke="#91edbd" stroke-width="2" /><path d="M 154.8959760788259 59.914689807001075 L 163 56 L 154.8959760788259 52.085310192998925" fill="none" stroke="#91edbd" stroke-width="2"/><text x="170" y="50" fill="#e4f1ec" font-size="16" >縮放</text><text x="170" y="80" fill="#e4f1ec" font-size="13" >只改顯示</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >放大能看像素，不生成新細節</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>