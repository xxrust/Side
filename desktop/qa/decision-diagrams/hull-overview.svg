<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="凸包工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>凸包工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 凸包 · 輸入 → 方法 → 輸出</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >① 連通區有凹口</text><g transform="translate(35,83)"><polygon points="25.00,25.00 225.00,25.00 225.00,60.00 135.00,60.00 135.00,109.00 225.00,109.00 225.00,145.00 25.00,145.00" fill="#91edbd" stroke="#91edbd" stroke-width="2" /><text x="148" y="92" fill="#f4b362" font-size="14" >凹口</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >綠色為原有區域</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >② 像拉緊一圈橡皮筋</text><g transform="translate(350,83)"><polygon points="25.00,25.00 225.00,25.00 225.00,60.00 135.00,60.00 135.00,109.00 225.00,109.00 225.00,145.00 25.00,145.00" fill="none" stroke="#acc3ce" stroke-width="2" /><polygon points="25.00,25.00 225.00,25.00 225.00,145.00 25.00,145.00" fill="none" stroke="#f4b362" stroke-width="2" /><circle cx="25" cy="25" r="5" fill="#91edbd" /><circle cx="225" cy="25" r="5" fill="#91edbd" /><circle cx="225" cy="145" r="5" fill="#91edbd" /><circle cx="25" cy="145" r="5" fill="#91edbd" /></g><text x="349" y="261" fill="#acc3ce" font-size="12" >只保留最外側支撐頂點</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >③ 凹口被包進範圍</text><g transform="translate(665,83)"><rect x="25" y="25" width="200" height="120" rx="0" fill="#f4b362" stroke="#f4b362"/><polygon points="25.00,25.00 225.00,25.00 225.00,60.00 135.00,60.00 135.00,109.00 225.00,109.00 225.00,145.00 25.00,145.00" fill="#91edbd"