<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="連通區工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>連通區工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 連通區 · 參數從哪裡來</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >固定四鄰接</text><g transform="translate(35,83)"><rect x="65" y="10" width="38" height="38" rx="1" fill="#213441" stroke="#456471"/><rect x="105" y="10" width="38" height="38" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="145" y="10" width="38" height="38" rx="1" fill="#213441" stroke="#456471"/><rect x="65" y="50" width="38" height="38" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="105" y="50" width="38" height="38" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="145" y="50" width="38" height="38" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="65" y="90" width="38" height="38" rx="1" fill="#213441" stroke="#456471"/><rect x="105" y="90" width="38" height="38" rx="1" fill="#e8f3e9" stroke="#456471"/><rect x="145" y="90" width="38" height="38" rx="1" fill="#213441" stroke="#456471"/><text x="15" y="155" fill="#e4f1ec" font-size="16" >斜角未列入相鄰</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >不是自動比較四鄰接與八鄰接後選出</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >固定工程篩選</text><g transform="translate(350,83)"><text x="7" y="29" fill="#e4f1ec" font-size="19" >0.3% ≤ 占比 ≤ 90%</text><text x="7" y="76" fill="#e4f1ec" font-size="19" >接觸圖邊 &lt; 3 側</text><text x="7" y="123" fill="#e4f1ec" font-size="19" >兩軸跨度均 ≥ 5 格</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >本圖依據會逐項畫出通過與拒絕</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >固定顯示上限</text><g transform="translate(665,83)"><text x="13" y="36" fill="#e4f1ec" font-size="19" >通過者依面積排序</text><text x="28" y="95" fill="#91edbd" font-size="28" >1  2  3  …  8</text><text x="13" y="147" fill="#f4b362" font-size="15" >第 9 名仍可能是真工件</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >前 8 是清單限制，非算法置信度</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>