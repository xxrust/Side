<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="規則判定工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>規則判定工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 規則判定 · 輸入 → 方法 → 輸出</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >① 有效量測 + 人定規格</text><g transform="translate(35,83)"><text x="10" y="30" fill="#e4f1ec" font-size="20" >量測示例：10.02 mm</text><text x="10" y="79" fill="#e4f1ec" font-size="16" >規格示例：9.90–10.10 mm</text><text x="10" y="132" fill="#f4b362" font-size="16" >規格由人確認，不能猜</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >示例數字不是目前專案的正式公差</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >② 比較是否落在範圍內</text><g transform="translate(350,83)"><rect x="60" y="47" width="140" height="42" rx="0" fill="#2c6650" stroke="#91edbd"/><line x1="10" y1="110" x2="245" y2="110" stroke="#acc3ce" stroke-width="2" /><line x1="60" y1="105" x2="60" y2="115" stroke="#acc3ce" stroke-width="2" /><text x="60" y="135" fill="#acc3ce" font-size="12" text-anchor="middle">下限</text><line x1="200" y1="105" x2="200" y2="115" stroke="#acc3ce" stroke-width="2" /><text x="200" y="135" fill="#acc3ce" font-size="12" text-anchor="middle">上限</text><circle cx="134" cy="69" r="6" fill="#91edbd" /><line x1="134" y1="75" x2="134" y2="106" stroke="#91edbd" stroke-width="2" /><text x="82" y="27" fill="#91edbd" font-size="15" >含兩端邊界</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >值與單位都有效才進入比較</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >③ 結果有三種</text><g transform="translate(665,83)"><rect x="5" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="17" y="23" fill="#91edbd" font-size="13" >OK：有效且在範圍內</text><rect x="5" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#ef9692"/><text x="17" y="69" fill="#ef9692" font-size="13" >NG：有效但超出範圍</text><rect x="5" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#f4b362"/><text x="17" y="115" fill="#f4b362" font-size="13" >UNKNOWN：證據不足</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >UNKNOWN 不應被當成 NG 或 OK</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>