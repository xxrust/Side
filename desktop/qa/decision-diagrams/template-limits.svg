<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="參考模板工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>參考模板工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 參考模板 · 何時不能相信結果</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >稀疏點間有缺陷</text><g transform="translate(35,83)"><rect x="30" y="10" width="180" height="110" rx="2" fill="#b9ced1" stroke="#e4f1ec"/><rect x="71.4" y="37.5" width="77.4" height="44" rx="0" fill="#10212b" stroke="#456471"/><line x1="85" y1="10" x2="85" y2="119" stroke="#ef9692" stroke-width="5" /><circle cx="40" cy="35" r="4" fill="#91edbd" /><circle cx="65" cy="35" r="4" fill="#91edbd" /><circle cx="110" cy="35" r="4" fill="#91edbd" /><circle cx="140" cy="35" r="4" fill="#91edbd" /><circle cx="170" cy="35" r="4" fill="#91edbd" /><circle cx="199" cy="35" r="4" fill="#91edbd" /></g><text x="34" y="261" fill="#acc3ce" font-size="12" >紅細痕沒有落到綠色取樣點</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >模板可能完全沒變</text><g transform="translate(350,83)"><text x="15" y="43" fill="#e4f1ec" font-size="20" >484 個取樣值仍相同</text><text x="15" y="101" fill="#f4b362" font-size="19" >匹配分數仍可很高</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >定位模板不會證明表面沒有缺陷</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >任務要分開</text><g transform="translate(665,83)"><rect x="7" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="23" fill="#91edbd" font-size="13" >定位：找到對象在哪裡</text><rect x="7" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#78bddd"/><text x="19" y="69" fill="#78bddd" font-size="13" >量測：檢查幾何尺寸</text><rect x="7" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#f4b362"/><text x="19" y="115" fill="#f4b362" font-size="13" >外觀：需額外像素檢查</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >不能把定位通過當作外觀全檢</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>