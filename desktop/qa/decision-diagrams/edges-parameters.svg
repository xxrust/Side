<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="找線工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>找線工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 找線 · 參數從哪裡來</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >搜尋與方向</text><g transform="translate(35,83)"><text x="5" y="32" fill="#e4f1ec" font-size="20" >灰階差預設 18</text><text x="5" y="78" fill="#e4f1ec" font-size="19" >方向偏差預設 15°</text><text x="5" y="129" fill="#e4f1ec" font-size="15" >搜尋半寬：7%，限 12–45 px</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >高級參數可調，以方案實際值為準</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >依序試切向平均</text><g transform="translate(350,83)"><text x="8" y="37" fill="#91edbd" font-size="24" >1 → 5 → 9 → 15 px</text><rect x="8" y="65" width="225" height="12" rx="9" fill="#78bddd" stroke="#456471"/><rect x="8" y="96" width="225" height="34" rx="9" fill="#346574" stroke="#456471"/><text x="8" y="155" fill="#e4f1ec" font-size="15" >窄窗口已過條件，就停止</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >平均可減噪，也可能抹去局部細節</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >固定品質門檻</text><g transform="translate(665,83)"><rect x="7" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="23" fill="#91edbd" font-size="13" >覆蓋 ≥ 65%</text><rect x="7" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="69" fill="#91edbd" font-size="13" >RMS ≤ 1.5 px</text><rect x="7" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="115" fill="#91edbd" font-size="13" >連續性 ≥ 55%</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >另需局部支持、缺口與意圖距離條件</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>