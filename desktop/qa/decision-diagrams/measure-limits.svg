<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="幾何量測工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>幾何量測工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 幾何量測 · 何時不能相信結果</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >四邊看似合理</text><g transform="translate(35,83)"><polygon points="34.00,25.00 217.00,32.00 221.00,145.00 38.00,138.00" fill="none" stroke="#91edbd" stroke-width="2" /><circle cx="34" cy="25" r="5" fill="#f4b362" /><circle cx="217" cy="32" r="5" fill="#f4b362" /><circle cx="221" cy="145" r="5" fill="#f4b362" /><circle cx="38" cy="138" r="5" fill="#f4b362" /><text x="100" y="91" fill="#e4f1ec" font-size="18" >4 交點</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >幾何相交本身可能完全正確</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >但模型假設不成立</text><g transform="translate(350,83)"><polygon points="30.00,35.00 225.00,16.00 195.00,147.00 60.00,129.00" fill="none" stroke="#f4b362" stroke-width="2" /><text x="36" y="167" fill="#f4b362" font-size="16" >透視 / 非平面 / 畸變</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >低擬合殘差不是尺寸誤差上界</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >校準與場景一起核對</text><g transform="translate(665,83)"><rect x="7" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="23" fill="#91edbd" font-size="13" >近矩形、平面、成像穩定</text><rect x="7" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="69" fill="#91edbd" font-size="13" >有效實測標定</text><rect x="7" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#f4b362"/><text x="19" y="115" fill="#f4b362" font-size="13" >跨樣本與標準件驗證</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >只在驗證過的條件內使用結果</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>