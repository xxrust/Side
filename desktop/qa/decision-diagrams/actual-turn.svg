<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="本次凸包建構的真實彈出步驟" data-diagram-kind="actual" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>本次凸包建構的真實彈出步驟</title><rect width="960" height="420" fill="#10212b"/><text x="24" y="32" fill="#91edbd" font-size="19" >本次凸包建構 · 重播一個真實「移除中間點」步驟</text><line x1="265.625" y1="95" x2="265.625" y2="210" stroke="#acc3ce" stroke-width="3" stroke-dasharray="7 5"/><line x1="265.625" y1="210" x2="265.625" y2="325" stroke="#acc3ce" stroke-width="3" stroke-dasharray="7 5"/><line x1="265.625" y1="95" x2="265.625" y2="325" stroke="#91edbd" stroke-width="2" /><path d="M 261.7103101929989 316.8959760788259 L 265.625 325 L 269.5396898070011 316.8959760788259" fill="none" stroke="#91edbd" stroke-width="2"/><circle cx="265.625" cy="95" r="6" fill="#91edbd" /><text x="275.625" y="83" fill="#91edbd" font-size="16" >A</text><circle cx="265.625" cy="210" r="6" fill="#f4b362" /><text x="275.625" y="198" fill="#f4b362" font-size="16" >B · 移出此鏈</text><circle cx="265.625" cy="325" r="6" fill="#91edbd" /><text x="275.625" y="313" fill="#91edbd" font-size="16" >C · 新點</text><rect x="548" y="76" width="382" height="255" rx="9" fill="#192f3b" stroke="#456471"/><text x="571" y="112" fill="#e4f1ec" font-size="17" >A = (164, 160)</text><text x="571" y="149" fill="#f4b362" font-size="17" >B = (164, 164)</text><text x="571" y="186" fill="#e4f1ec" font-size="17" >C = (164, 168)</text><text x="571" y="229" fill="#f4b362" font-size="21" >叉積 = 0 ≤ 0</text><text x="571" y="270" fill="#e4f1ec" font-size="16" >三點共線：中點不需作頂點</text><text x="571" y="306" fill="#acc3ce" font-size="14" >這是下鏈的一次實際彈出紀錄</text><text x="30" y="380" fill="#e4f1ec" font-size="17" >灰虛線：原本的 A → B → C；綠線：退回後的 A → C。</text><text x="30" y="411" fill="#acc3ce" font-size="14" >移出一條建構鏈，不等於直接從原圖刪除像素；最終頂點還由另一條鏈共同決定。</text></svg>