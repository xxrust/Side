<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="規則判定工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>規則判定工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 規則判定 · 何時不能相信結果</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >可靠找到目標</text><g transform="translate(35,83)"><rect x="60" y="20" width="130" height="103" rx="1" fill="#b9ced1" stroke="#acc3ce"/><rect x="89.9" y="47.81" width="58.5" height="43.26" rx="1" fill="#10212b" stroke="#10212b"/><text x="19" y="154" fill="#91edbd" font-size="15" >可給出「找到」的證據</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >可靠定位是存在的正向證據</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >沒找到不等於缺失</text><g transform="translate(350,83)"><rect x="18" y="16" width="215" height="116" rx="9" fill="#192f3b" stroke="#456471"/><text x="46" y="84" fill="#f4b362" font-size="22" >未可靠定位</text><text x="12" y="158" fill="#e4f1ec" font-size="13" >可能因照明 / 遮擋 / 位置變化</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >目前不能直接把未找到判為缺失 NG</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >保留 UNKNOWN</text><g transform="translate(665,83)"><rect x="7" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#f4b362"/><text x="19" y="23" fill="#f4b362" font-size="13" >證據不足 → UNKNOWN</text><rect x="7" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="69" fill="#91edbd" font-size="13" >人工答案與算法結果分開</text><rect x="7" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#78bddd"/><text x="19" y="115" fill="#78bddd" font-size="13" >補證據，再驗證與發布</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >不強迫每張圖都輸出 OK 或 NG</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>