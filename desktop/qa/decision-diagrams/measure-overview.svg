<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="幾何量測工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>幾何量測工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 幾何量測 · 輸入 → 方法 → 輸出</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >① 取得四條合格邊</text><g transform="translate(35,83)"><line x1="20" y1="25" x2="230" y2="32" stroke="#91edbd" stroke-width="2" /><line x1="23" y1="138" x2="234" y2="145" stroke="#91edbd" stroke-width="2" /><line x1="34" y1="8" x2="38" y2="157" stroke="#78bddd" stroke-width="2" /><line x1="217" y1="12" x2="221" y2="160" stroke="#78bddd" stroke-width="2" /></g><text x="34" y="261" fill="#acc3ce" font-size="12" >任一側失敗，尺寸仍是 UNKNOWN</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >② 相交得到四角</text><g transform="translate(350,83)"><polygon points="34.00,25.00 217.00,32.00 221.00,145.00 38.00,138.00" fill="none" stroke="#91edbd" stroke-width="2" /><circle cx="34" cy="25" r="5" fill="#f4b362" /><circle cx="217" cy="32" r="5" fill="#f4b362" /><circle cx="221" cy="145" r="5" fill="#f4b362" /><circle cx="38" cy="138" r="5" fill="#f4b362" /><text x="100" y="91" fill="#e4f1ec" font-size="18" >4 交點</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >檢查近矩形假設與退化交點</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >③ 邊長與標定換算</text><g transform="translate(665,83)"><text x="5" y="30" fill="#e4f1ec" font-size="16" >寬 = (上邊長 + 下邊長) / 2</text><text x="5" y="76" fill="#e4f1ec" font-size="16" >高 = (左邊長 + 右邊長) / 2</text><line x1="119" y1="92" x2="119" y2="115" stroke="#91edbd" stroke-width="2" /><path d="M 115.08531019299893 106.89597607882591 L 119 115 L 122.91468980700107 106.89597607882591" fill="none" stroke="#91edbd" stroke-width="2"/><text x="18" y="148" fill="#91edbd" font-size="16" >px → 有效實測標定 → mm</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >角點可靠性與標定都影響尺寸</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>