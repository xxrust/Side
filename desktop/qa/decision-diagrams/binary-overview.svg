<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="閾值分割工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>閾值分割工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 閾值分割 · 輸入 → 方法 → 輸出</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >① 看亮度分布</text><g transform="translate(35,83)"><rect x="10" y="134" width="8" height="1" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="21" y="127" width="8" height="8" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="32" y="106" width="8" height="29" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="43" y="73" width="8" height="62" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="54" y="55" width="8" height="80" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="65" y="73" width="8" height="62" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="76" y="106" width="8" height="29" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="87" y="126" width="8" height="9" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="98" y="133" width="8" height="2" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="109" y="133" width="8" height="2" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="120" y="128" width="8" height="7" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="131" y="117" width="8" height="18" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="142" y="96" width="8" height="39" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="153" y="68" width="8" height="67" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="164" y="41" width="8" height="94" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="175" y="30" width="8" height="105" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="186" y="41" width="8" height="94" rx="0" fill="#78bddd" stroke="#78bddd"/><rect x="197" y="68" width="8" height="67" rx="0"