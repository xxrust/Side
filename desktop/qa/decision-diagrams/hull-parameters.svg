<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="凸包工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>凸包工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 凸包 · 參數從哪裡來</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >沒有獨立閾值</text><g transform="translate(35,83)"><polygon points="25.00,25.00 225.00,25.00 225.00,60.00 135.00,60.00 135.00,109.00 225.00,109.00 225.00,145.00 25.00,145.00" fill="none" stroke="#91edbd" stroke-width="2" /><text x="144" y="91" fill="#e4f1ec" font-size="13" >已選邊界</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >選定點集後，幾何結果由座標決定</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >以轉向判斷頂點</text><g transform="translate(350,83)"><circle cx="18" cy="128" r="5" fill="#91edbd" /><circle cx="115" cy="73" r="5" fill="#f4b362" /><circle cx="232" cy="22" r="5" fill="#91edbd" /><line x1="18" y1="128" x2="115" y2="73" stroke="#acc3ce" stroke-width="2" /><line x1="115" y1="73" x2="232" y2="22" stroke="#acc3ce" stroke-width="2" /><text x="3" y="163" fill="#e4f1ec" font-size="14" >共線／轉向不符 → 退回中點</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >本圖可重播真實座標及叉積</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >可改的是上游</text><g transform="translate(665,83)"><rect x="7" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="23" fill="#91edbd" font-size="13" >換連通區</text><rect x="7" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="69" fill="#91edbd" font-size="13" >改閾值／採樣間隔</text><rect x="7" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#f4b362"/><text x="19" y="115" fill="#f4b362" font-size="13" >人工修正圈選</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >不能直接改頂點數或新增格數</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>