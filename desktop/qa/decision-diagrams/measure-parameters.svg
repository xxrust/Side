<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 292" role="img" aria-label="幾何量測工具圖解（教學示意，非目前圖片實算）" data-diagram-kind="schematic" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>幾何量測工具圖解（教學示意，非目前圖片實算）</title><rect width="960" height="292" fill="#10212b"/><text x="21" y="24" fill="#acc3ce" font-size="14" >教學示意 · 幾何量測 · 參數從哪裡來</text><rect x="20" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="34" y="65" fill="#91edbd" font-size="16" >先過幾何約束</text><g transform="translate(35,83)"><line x1="20" y1="20" x2="225" y2="29" stroke="#91edbd" stroke-width="3" /><line x1="20" y1="125" x2="225" y2="134" stroke="#91edbd" stroke-width="3" /><text x="20" y="77" fill="#e4f1ec" font-size="17" >對邊方向差 ≤ 3°</text><text x="20" y="163" fill="#e4f1ec" font-size="17" >正交誤差 ≤ 5°</text></g><text x="34" y="261" fill="#acc3ce" font-size="12" >固定近矩形模型，不適用任意輪廓</text><rect x="335" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="349" y="65" fill="#91edbd" font-size="16" >px 轉 mm 的來源</text><g transform="translate(350,83)"><text x="14" y="33" fill="#e4f1ec" font-size="22" >像素長度</text><text x="98" y="75" fill="#91edbd" font-size="24" >×</text><text x="14" y="118" fill="#e4f1ec" font-size="18" >已確認雙軸實測比例</text><text x="9" y="161" fill="#f4b362" font-size="14" >理論像元／倍率不冒充實測</text></g><text x="349" y="261" fill="#acc3ce" font-size="12" >比例與當前成像配置必須相容</text><rect x="650" y="40" width="290" height="238" rx="9" fill="#192f3b" stroke="#456471"/><text x="664" y="65" fill="#91edbd" font-size="16" >哪些能改</text><g transform="translate(665,83)"><rect x="7" y="3" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="23" fill="#91edbd" font-size="13" >可修改：上游 ROI / 找線</text><rect x="7" y="49" width="240" height="29" rx="5" fill="#192f3b" stroke="#91edbd"/><text x="19" y="69" fill="#91edbd" font-size="13" >可重做：實測標定</text><rect x="7" y="95" width="240" height="29" rx="5" fill="#192f3b" stroke="#78bddd"/><text x="19" y="115" fill="#78bddd" font-size="13" >唯讀：四角、寬、高</text></g><text x="664" y="261" fill="#acc3ce" font-size="12" >修改後需重算與重新驗證</text><line x1="311" y1="160" x2="333" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 324.8959760788259 163.91468980700108 L 333 160 L 324.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><line x1="626" y1="160" x2="648" y2="160" stroke="#91edbd" stroke-width="2" /><path d="M 639.8959760788259 163.91468980700108 L 648 160 L 639.8959760788259 156.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/></svg>