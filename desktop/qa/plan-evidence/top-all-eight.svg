<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" role="img" aria-label="完整找線參數比較矩陣" data-diagram-kind="actual" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>完整找線參數比較矩陣</title><rect width="960" height="440" fill="#10212b"/><text x="22" y="29" fill="#91edbd" font-size="20" >上邊 · 先完整比較，再交代取捨</text><text x="24" y="60" fill="#acc3ce" font-size="14" >1／5／9／15 px × 中段 60%／50%，八組全部計算；通過不等於最優。</text><text x="25" y="137" fill="#acc3ce" font-size="16" >中段 60%</text><rect x="170" y="84" width="175" height="107" rx="9" fill="#192f3b" stroke="#91edbd"/><text x="180" y="109" fill="#91edbd" font-size="17" >1 px · 採用</text><text x="180" y="137" fill="#acc3ce" font-size="12" >RMS 0.405 px</text><text x="180" y="161" fill="#acc3ce" font-size="11" >覆蓋 98.013%</text><text x="180" y="181" fill="#acc3ce" font-size="11" >連續 98.013%</text><rect x="362" y="84" width="175" height="107" rx="9" fill="#192f3b" stroke="#78bddd"/><text x="372" y="109" fill="#78bddd" font-size="17" >5 px · 通過</text><text x="372" y="137" fill="#acc3ce" font-size="12" >RMS 0.326 px</text><text x="372" y="161" fill="#acc3ce" font-size="11" >覆蓋 99.333%</text><text x="372" y="181" fill="#acc3ce" font-size="11" >連續 99.333%</text><rect x="554" y="84" width="175" height="107" rx="9" fill="#192f3b" stroke="#78bddd"/><text x="564" y="109" fill="#78bddd" font-size="17" >9 px · 通過</text><text x="564" y="137" fill="#acc3ce" font-size="12" >RMS 0.324 px</text><text x="564" y="161" fill="#acc3ce" font-size="11" >覆蓋 99.329%</text><text x="564" y="181" fill="#acc3ce" font-size="11" >連續 99.329%</text><rect x="746" y="84" width="175" height="107" rx="9" fill="#192f3b" stroke="#78bddd"/><text x="756" y="109" fill="#78bddd" font-size="17" >15 px · 通過</text><text x="756" y="137" fill="#acc3ce" font-size="12" >RMS 0.318 px</text><text x="756" y="161" fill="#acc3ce" font-size="11" >覆蓋 99.324%</text><text x="756" y="181" fill="#acc3ce" font-size="11" >連續 99.324%</text><text x="25" y="256" fill="#acc3ce" font-size="16" >中段 50%</text><rect x="170" y="203" width="175" height="107" rx="9" fill="#192f3b" stroke="#78bddd"/><text x="180" y="228" fill="#78bddd" font-size="17" >1 px · 通過</text><text x="180" y="256" fill="#acc3ce" font-size="12" >RMS 0.389 px</text><text x="180" y="280" fill="#acc3ce" font-size="11" >覆蓋 98.413%</text><text x="180" y="300" fill="#acc3ce" font-size="11" >連續 98.413%</text><rect x="362" y="203" width="175" height="107" rx="9" fill="#192f3b" stroke="#78bddd"/><text x="372" y="228" fill="#78bddd" font-size="17" >5 px · 通過</text><text x="372" y="256" fill="#acc3ce" font-size="12" >RMS 0.338 px</text><text x="372" y="280" fill="#acc3ce" font-size="11" >覆蓋 100%</text><text x="372" y="300" fill="#acc3ce" font-size="11" >連續 100%</text><rect x="554" y="203" width="175" height="107" rx="9" fill="#192f3b" stroke="#78bddd"/><text x="564" y="228" fill="#78bddd" font-size="17" >9 px · 通過</text><text x="564" y="256" fill="#acc3ce" font-size="12" >RMS 0.323 px</text><text x="564" y="280" fill="#acc3ce" font-size="11" >覆蓋 100%</text><text x="564" y="300" fill="#acc3ce" font-size="11" >連續 100%</text><rect x="746" y="203" width="175" height="107" rx="9" fill="#192f3b" stroke="#78bddd"/><text x="756" y="228" fill="#78bddd" font-size="17" >15 px · 通過</text><text x="756" y="256" fill="#acc3ce" font-size="12" >RMS 0.319 px</text><text x="756" y="280" fill="#acc3ce" font-size="11" >覆蓋 100%</text><text x="756" y="300" fill="#acc3ce" font-size="11" >連續 100%</text><text x="25" y="352" fill="#91edbd" font-size="18" >已測設定的線位一致</text><text x="25" y="385" fill="#e4f1ec" font-size="15" >採用 1 px；優先少做額外平均，同寬優先較長搜尋段。</text><text x="25" y="418" fill="#acc3ce" font-size="13" >參數範圍是工程搜尋預設；未搜尋其他寬度、閾值、噪聲或圖片，不宣稱全域最佳。</text></svg>