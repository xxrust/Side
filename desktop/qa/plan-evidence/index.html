<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>project1 圖像依據</title><style>body{font:14px system-ui;background:#10212b;color:#e4f1ec;margin:0;height:100vh;display:grid;grid-template-rows:60px minmax(0,1fr) 35px}header{display:flex;align-items:center;gap:16px;padding:0 22px}select,button{background:#203742;color:inherit;border:1px solid #597281;padding:8px}object{width:100%;height:100%}footer{padding:7px 22px;font-size:11px;color:#acc3ce}</style><header><strong>project1 · 正式工具 SVG</strong><select id="pages"><option>decide.svg</option><option>four-edges.svg</option><option>left-all-eight.svg</option><option>left-candidates.svg</option><option>left-contrast.svg</option><option>left-coverage.svg</option><option>left-residuals.svg</option><option>left-supports.svg</option><option>locate.svg</option><option>matching-statistics.svg</option><option>measure.svg</option><option>template.svg</option><option>top-all-eight.svg</option><option>top-comparison.svg</option><option>top-sensitivity.svg</option><option>why-find-lines.svg</option><option>why-left-15px.svg</option><option>why-right-9px.svg</option></select><button id="prev">←</button><button id="next">→</button></header><object id="figure" type="image/svg+xml"></object><footer>原圖與真實結果：由 project1 在隔離記憶體中重跑；原專案未修改。非原生視窗截圖。</footer><script>const p=document.getElementById('pages'),f=document.getElementById('figure');function show(){f.data=p.value}p.onchange=show;document.getElementById('prev').onclick=()=>{p.selectedIndex=Math.max(0,p.selectedIndex-1);show()};document.getElementById('next').onclick=()=>{p.selectedIndex=Math.min(p.options.length-1,p.selectedIndex+1);show()};p.value='four-edges.svg';show();</script></html>
