<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-label="找線的工具選擇依據" data-diagram-kind="rationale" style="font-family:'Heiti TC','PingFang TC',sans-serif"><title>找線的工具選擇依據</title><rect width="960" height="420" fill="#10212b"/><text x="25" y="32" fill="#acc3ce" font-size="16" >選擇依據 · 依檢查項與人工示教編譯的內建流程；未自主比較替代算法</text><rect x="24" y="66" width="284" height="225" rx="9" fill="#192f3b" stroke="#456471"/><text x="40" y="98" fill="#91edbd" font-size="17" >① 任務要得到什麼</text><text x="40" y="139" fill="#e4f1ec" font-size="19" >lid寬 · lid</text><line x1="313" y1="180" x2="334" y2="180" stroke="#91edbd" stroke-width="2" /><path d="M 325.8959760788259 183.91468980700108 L 334 180 L 325.8959760788259 176.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><rect x="341" y="66" width="284" height="225" rx="9" fill="#192f3b" stroke="#456471"/><text x="357" y="98" fill="#91edbd" font-size="17" >② 此工具負責什麼</text><text x="357" y="139" fill="#e4f1ec" font-size="19" >由原圖找到量測所需的真實</text><text x="357" y="166" fill="#e4f1ec" font-size="19" >四邊</text><line x1="630" y1="180" x2="651" y2="180" stroke="#91edbd" stroke-width="2" /><path d="M 642.8959760788259 183.91468980700108 L 651 180 L 642.8959760788259 176.08531019299892" fill="none" stroke="#91edbd" stroke-width="2"/><rect x="658" y="66" width="284" height="225" rx="9" fill="#192f3b" stroke="#456471"/><text x="674" y="98" fill="#91edbd" font-size="17" >③ 可核對的輸出</text><text x="674" y="139" fill="#e4f1ec" font-size="19" >搜尋帶、支持點與擬合直線</text><rect x="24" y="315" width="916" height="92" rx="9" fill="#192f3b" stroke="#f4b362"/><text x="41" y="345" fill="#f4b362" font-size="16" >尚需核對的假設</text><text x="41" y="374" fill="#acc3ce" font-size="15" >近矩形平面假設；背景線也可能通過品質條件</text></svg>