[package]
name = "agentcv-desktop"
version = "0.16.9"
edition = "2021"

[features]
default = ["mimalloc-host"]
mimalloc-host = ["dep:mimalloc"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = {version = "1", features = ["float_roundtrip", "preserve_order"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
base64 = "0.22"
libc = "0.2"
mimalloc = { version = "=0.1.52", optional = true }

sha2 = "=0.10.9"

[target.'cfg(target_arch = "aarch64")'.dependencies]
# SHA-256 remains byte-identical; the crate detects CPU support and retains its
# software fallback. Avoid software hashing of every live image on Apple Silicon.
sha2 = { version = "=0.10.9", features = ["asm"] }

[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"
