[package]
name = "agentcv-desktop"
version = "0.16.9"
edition = "2021"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = {version = "1", features = ["float_roundtrip"] }
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
base64 = "0.22"
libc = "0.2"

sha2 = "=0.10.9"

[target.'cfg(windows)'.dependencies]
winreg = "=0.55.0"
