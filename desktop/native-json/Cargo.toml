[package]
name = "agentcv-json"
version = "0.1.0"
edition = "2021"

[lib]
name = "_agentcv_json"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "=0.23.5", features = ["extension-module", "abi3-py310"] }
serde_json = "1"
zmij = "=1.0.23"

[build-dependencies]
pyo3-build-config = "=0.23.5"

[profile.release]
lto = "thin"
codegen-units = 1
