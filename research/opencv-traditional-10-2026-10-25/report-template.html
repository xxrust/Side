<body><div id="app"><header class="masthead"><div class="brand"><span class="brand-mark">CV</span><div><strong>AgentCV · 傳統視覺用例庫</strong><small>13-CV / RESEARCH · 2026.10.25</small></div></div><nav aria-label="報告頁面"><button data-page="overview">10 種用例</button><button data-page="coverage">覆蓋矩陣</button><button data-page="protocol">共同測試規則</button><button data-page="sources">來源與素材</button></nav><span class="review-badge">研究收集 · 產品程式碼未改</span></header><main id="screen"></main><footer class="footer"><span id="footerText">OpenCV 4.x · 收集與測試設計，尚未在 AgentCV 驗收</span><span>← → 切用例 · 1–7 切頁籤 · Esc 回總覽</span><a href="https://github.com/opencv/opencv/tree/4.x" target="_blank" rel="noopener noreferrer">OpenCV 官方倉庫 ↗</a></footer></div><noscript><p class="no-js">此報告使用本機 JavaScript 切換頁面。完整用例資料在同文件夾的 cases.json；不需要網路服務或模型連線。</p></noscript>
<script>
'use strict';
const CASES=__CASES__,ASSETS=__ASSETS__,SOURCE=__SOURCE__,ANNOTATIONS=__ANNOTATIONS__,MANIFEST=__MANIFEST__,TESTS=__TESTS__;
const tabs=[['samples','看樣品'],['flow','流程與理由'],['evidence','圖像證據'],['parameters','參數比較'],['data','資料與真值'],['acceptance','驗收與邊界'],['references','OpenCV 來源']];
const $=id=>document.getElementById(id),screen=$('screen'),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const state={view:'overview',index:0,tab:'samples',figure:0,sourcePage:0,protocol:0};
const sourceUrl=url=>url.startsWith('repo:')?'https://github.com/opencv/opencv/blob/'+SOURCE.mainSha+'/'+url.slice(5):url.startsWith('extra:')?'https://github.com/opencv/opencv_extra/blob/'+SOURCE.extraSha+'/'+url.slice(6):url;
const img=p=>ASSETS[p]||p,ext=(url,label,cls='')=>`<a class="${cls}" href="${esc(sourceUrl(url))}" target="_blank" rel="noopener noreferrer">${esc(label)} ↗</a>`;
const info=(label,title,content,cls='')=>`<section class="info ${cls}"><div class="label">${esc(label)}</div>${title?`<h3>${esc(title)}</h3>`:''}${content}</section>`;
const p=s=>`<p>${esc(s)}</p>`,outcomes=c=>`<div class="outputs">${c.outputs.map(o=>`<span>${esc(o)}</span>`).join('')}</div>`;
function download(name,data,type='application/json'){const raw=typeof data==='string'?data:JSON.stringify(data,null,2),url=URL.createObjectURL(new Blob([raw],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500)}
function navigate(view,index=state.index,tab=state.tab){const hash=view==='case'?`#case-${CASES[index].id}-${tab}`:view==='protocol'?`#protocol-${state.protocol}`:'#'+view;if(location.hash===hash)render();else location.hash=hash}
function readRoute(){const route=location.hash.slice(1),m=route.match(/^case-(\d{2})-([a-z]+)$/),q=route.match(/^protocol-([0-2])$/);if(m){const i=CASES.findIndex(c=>c.id===m[1]);if(i>=0&&tabs.some(t=>t[0]===m[2])){if(state.view!=='case'||state.index!==i||state.tab!==m[2])state.figure=0;state.view='case';state.index=i;state.tab=m[2];return}}state.view=['overview','coverage','sources'].includes(route)?route:q?'protocol':'overview';if(q)state.protocol=Number(q[1])}
function intro(title,sub,aside=''){return `<div class="page-intro"><div><div class="eyebrow">TRADITIONAL CV · TEST CASE COLLECTION</div><h1>${esc(title)}</h1><p class="sub">${esc(sub)}</p></div>${aside?`<div class="intro-aside">${aside}</div>`:''}</div>`}
function renderOverview(){screen.innerHTML=intro('十種樣品，十條可審查的流程。','4 個官方場景＋6 個工業延伸；從齒形、孔洞與黏連，到姿態、差分和讀碼。點選一張，看完整測試安排。',`<b>${SOURCE.assetCount}</b> 張官方圖像已收錄<br><b>${SOURCE.syntheticCount}</b> 張合成圖與標註 · 全部尚未驗收`)+`<div class="overview-grid">${CASES.map((c,i)=>`<button class="case-card" data-case="${i}" aria-label="開啟用例 ${c.id} ${esc(c.name)}"><div class="thumb"><img src="${img(c.hero)}" alt="${esc(c.name)}的${c.hero.startsWith('synthetic')?'合成設計輸入':'OpenCV 官方原圖'}"><span class="number">${c.id}</span><span class="origin ${c.hero.startsWith('synthetic')?'synthetic':''}">${c.hero.startsWith('synthetic')?'合成輸入':'官方原圖'}</span></div><div class="card-copy"><h2>${esc(c.name)}</h2><p title="${esc(c.question)}">${esc(c.question)}</p><div class="card-meta"><span>${esc(c.category)}</span><span class="phase">${c.priority} · ${c.origin}</span></div></div></button>`).join('')}</div>`;screen.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>navigate('case',Number(b.dataset.case),'samples'))}
function visual(items,kind){const index=Math.max(0,Math.min(state.figure,items.length-1)),item=items[index];state.figure=index;return `<figure class="picture-panel"><div class="picture ${item[1].endsWith('.svg')?'diagram':''}" id="pictureBox"><img id="mainFigure" src="${img(item[1])}" alt="${esc(item[0])}"><span class="picture-kind">${esc(kind)}</span></div><div class="figure-controls"><button id="figurePrev" aria-label="上一張圖" ${index===0?'disabled':''}>←</button><select id="figurePicker" aria-label="選擇圖像">${items.map((x,i)=>`<option value="${i}" ${i===index?'selected':''}>${esc(x[0])}</option>`).join('')}</select><span>${index+1} / ${items.length}</span><button id="figureNext" aria-label="下一張圖" ${index===items.length-1?'disabled':''}>→</button><button id="expandFigure" class="expand-button">放大</button></div><figcaption class="caption" title="${esc(item[2])}">${esc(item[0])} · ${esc(item[2])}</figcaption></figure>`}

function renderCoverage(){screen.innerHTML=intro('讓用例暴露產品的邊界。','圓點表示這個用例會要求的能力，並不表示目前產品已支援。點用例名稱可查看流程。',`P1：先建立基本通用能力<br>P2：再挑戰分割、配準及結構化輸出`)+`<div class="case-body"><section class="matrix-wrap"><table class="matrix"><thead><tr><th>用例</th>${['目標圈定','孔洞','多件','色彩','幾何','缺陷','解碼'].map(v=>`<th>${v}</th>`).join('')}<th>建議</th></tr></thead><tbody>${CASES.map((c,i)=>`<tr><td><button data-matrix-case="${i}">${c.id} ${esc(c.name)}</button></td>${c.capabilities.map(v=>`<td>${v?'<span class="dot" aria-label="本案要求此能力"></span>':'<span class="dash">—</span>'}</td>`).join('')}<td><span class="priority">${c.priority}</span></td></tr>`).join('')}</tbody></table></section><aside class="matrix-side">${info('每個用例重新定義任務','',p('先給原圖、成像資料與樣品介紹，再定工件、部件、關係及要驗證的問題。算法方案跟著任務產生。'),'green')}${info('輸出不能只剩一個數字','',p('需要逐件遮罩、孔與線的關係、角度／姿態、缺陷區域及字串等資料型別。'))}${info('拒絕也是正式輸出','',p('無法分割、定位退化、成像不足與未讀到，要保留 UNKNOWN，不能一律當成樣品 NG。'),'amber')}${info('本輪的範圍','',p('只收集用例、素材與測試設計；產品、算法、Agent 工具與桌面程式均未修改。'))}</aside></div>`;screen.querySelectorAll('[data-matrix-case]').forEach(b=>b.onclick=()=>navigate('case',Number(b.dataset.matrixCase),'flow'))}
function renderProtocol(){const names=['樣本與真值','參數比較','驗收與回歸'];screen.innerHTML=intro('同一套測試紀律，覆蓋十種任務。','這些是後續測試協定；所有數值例子均為規劃或數學說明，不是產品實測成績。')+`<section class="detail"><nav class="tabs" aria-label="共同測試規則">${names.map((n,i)=>`<button data-protocol="${i}" class="${state.protocol===i?'active':''}">${n}</button>`).join('')}</nav><div id="protocolBody" class="protocol-layout"></div></section>`;let left='',right='';
 if(state.protocol===0){left=`<section class="protocol-visual"><h2>按實體與採集批次分組，先留驗收集。</h2><div class="lanes">${[['01','示教／調參集','理解目標、選工具與比較參數。','同一原圖的裁切、旋轉、加噪版本留在同組。'],['02','校準／確認集','核對門檻、誤差預算與拒絕條件。','標籤由人或外部量測基準確認。'],['03','鎖定驗收集','固定方案後才首次運行。','不得回頭挑參數；若更改方案，另保留新驗收證據。']].map(([n,title,copy,note])=>`<div class="lane"><span class="n">${n}</span><h3>${title}</h3><p>${copy}</p><small>${note}</small></div>`).join('')}</div><p class="protocol-note">每張保存：Specimen ID、Capture ID、成像配置、原圖 SHA-256、標註版本、來源組。沒有足夠獨立樣本，就明示缺口。</p></section>`;right=info('第一步不能省掉成像資料','',p('像元尺寸、倍率、Binning、裁切與重採樣逐圖關聯。理論尺度與實測標定分開；毫米結果需要有效標定與成像條件確認。'),'green')+info('答案分三層','',p('位置／輪廓真值、功能或尺寸真值、品質 OK／NG／UNKNOWN 分開。不能由待驗算法的輸出自製答案。'))+info('數量先按覆蓋需求安排','',p('每個用例都要涵蓋正常、各類缺陷和不可判情況，分布跨實體與採集時段。這輪尚未集齊正式驗收集。'),'amber')+info('合成資料的角色','',p('可以測真值傳遞、角度／位置回投和已知故障；不能取代反光、材質、光學畸變及真缺陷的實拍分布。'))}
 if(state.protocol===1){left=`<section class="protocol-visual"><h2>先定比較目標，再決定怎麼停止。</h2><div class="lanes">${[['01','聲明搜尋範圍','記錄參數值、來源、物理假設與運算預算。','範圍大可粗到細；必須保留已試／未試區及停止理由。'],['02','保留全部結果','原圖疊合、中間圖、品質指標及功能輸出一起保存。','低殘差、高匹配分數與最好看的圖，都不是精度真值。'],['03','選擇與拒絕','比較真值誤差、漏檢、誤報、敏感度與時間。','只有一組通過時，不能宣稱已有參數一致性證據。']].map(([n,title,copy,note])=>`<div class="lane"><span class="n">${n}</span><h3>${title}</h3><p>${copy}</p><small>${note}</small></div>`).join('')}</div><p class="protocol-note">本報告各案提供的是候選範圍。原圖上的數據、規格輸入、工程預設與搜索結果，必須分開標示。</p></section>`;right=info('統一解釋方式','',p('為何用工具 → 為何用此參數 → 看見哪些真實輸出 → 已知適用邊界。每張圖綁定輸入、工具與方案版本。'),'green')+info('功能指標先於漂亮的品質分數','',p('齒輪看漏齒；多孔件看孔位錯配；分水嶺看實例合併／分裂；印刷件看缺陷漏檢；QR 看完整字串。'))+info('一致也可能一起錯','',p('多組參數找到同一條背景線，仍可能一致。需要語義示教、外部真值和獨立圖片，才能核對是否找對。'),'amber')+info('展示未執行與失敗','',p('沒有運行的參數格標為未測；沒有保存的被拒假設不補畫。失效結果不冒充當前證據。'))}

 $('protocolBody').innerHTML=left+`<aside class="stack">${right}</aside>`;screen.querySelectorAll('[data-protocol]').forEach(b=>b.onclick=()=>{state.protocol=Number(b.dataset.protocol);navigate('protocol')})}
