<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><rect width="960" height="520" fill="#f3f2ec"/><g font-family="Heiti TC,PingFang TC,sans-serif"><text x="25" y="34" fill="#19343b" font-size="21" >多孔鈑金的孔數與孔位 · 必須保留的圖像證據</text><text x="25" y="60" fill="#637774" font-size="13" >流程示意 · 尚未執行算法 · 無實測分數</text><rect x="21" y="83" width="449" height="185" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="38" y="115" fill="#167a60" font-size="19" >01  原圖＋孔的編號</text><rect x="39" y="131" width="104" height="103" fill="#deebe2" stroke="#167a60" rx="14"/><path d="M55 150L130 212" stroke="#376f96" stroke-width="2" fill="none" /><path d="M55 212L130 150" stroke="#376f96" stroke-width="2" fill="none" /><text x="164" y="157" fill="#19343b" font-size="17" >外形、孔、開槽使用不同符號。</text><rect x="490" y="83" width="449" height="185" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="507" y="115" fill="#167a60" font-size="19" >02  遮罩＋輪廓樹</text><rect x="508" y="138" width="27" height="31" fill="#beddd0" stroke="none" rx="4"/><rect x="542" y="138" width="27" height="31" fill="#d6e7b9" stroke="none" rx="4"/><rect x="576" y="138" width="27" height="31" fill="#b8d4e5" stroke="none" rx="4"/><rect x="508" y="179" width="27" height="31" fill="#beddd0" stroke="none" rx="4"/><rect x="542" y="179" width="27" height="31" fill="#d6e7b9" stroke="none" rx="4"/><text x="633" y="157" fill="#19343b" font-size="17" >清楚看見每個孔如何成為工件的子</text><text x="633" y="182" fill="#19343b" font-size="17" >節點。</text><rect x="21" y="286" width="449" height="185" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="38" y="318" fill="#167a60" font-size="19" >03  局部座標疊合</text><path d="M48 431L145 431" stroke="#637774" stroke-width="2" fill="none" /><path d="M48 431L48 348" stroke="#637774" stroke-width="2" fill="none" /><text x="61" y="388" fill="#637774" font-size="14" >待實測</text><text x="164" y="360" fill="#19343b" font-size="17" >顯示基準、配對線、名義孔位與實</text><text x="164" y="385" fill="#19343b" font-size="17" >際孔位。</text><rect x="490" y="286" width="449" height="185" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="507" y="318" fill="#167a60" font-size="19" >04  孔位誤差圖</text><rect x="508" y="345" width="108" height="23" fill="#edf0e9" stroke="none" rx="3"/><text x="516" y="362" fill="#637774" font-size="11" >輸入指紋</text><rect x="508" y="375" width="108" height="23" fill="#edf0e9" stroke="none" rx="3"/><text x="516" y="392" fill="#637774" font-size="11" >參數與版本</text><rect x="508" y="405" width="108" height="23" fill="#edf0e9" stroke="none" rx="3"/><text x="516" y="422" fill="#637774" font-size="11" >全部候選</text><text x="633" y="360" fill="#19343b" font-size="17" >X／Y 偏差及孔距；無效基準時不</text><text x="633" y="385" fill="#19343b" font-size="17" >報正式尺寸。</text></g></svg>