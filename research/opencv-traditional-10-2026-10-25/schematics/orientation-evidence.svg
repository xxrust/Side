<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><rect width="960" height="520" fill="#f3f2ec"/><g font-family="Heiti TC,PingFang TC,sans-serif"><text x="25" y="34" fill="#19343b" font-size="21" >多個沖壓件的擺放方向 · 必須保留的圖像證據</text><text x="25" y="60" fill="#637774" font-size="13" >流程示意 · 尚未執行算法 · 無實測分數</text><rect x="21" y="83" width="449" height="185" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="38" y="115" fill="#167a60" font-size="19" >01  原圖＋逐件標號</text><rect x="39" y="131" width="104" height="103" fill="#deebe2" stroke="#167a60" rx="14"/><path d="M55 150L130 212" stroke="#376f96" stroke-width="2" fill="none" /><path d="M55 212L130 150" stroke="#376f96" stroke-width="2" fill="none" /><text x="164" y="157" fill="#19343b" font-size="17" >每個零件各有自己的輪廓、中心與</text><text x="164" y="182" fill="#19343b" font-size="17" >主軸。</text><rect x="490" y="83" width="449" height="185" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="507" y="115" fill="#167a60" font-size="19" >02  點集與兩根主軸</text><rect x="508" y="138" width="27" height="31" fill="#beddd0" stroke="none" rx="4"/><rect x="542" y="138" width="27" height="31" fill="#d6e7b9" stroke="none" rx="4"/><rect x="576" y="138" width="27" height="31" fill="#b8d4e5" stroke="none" rx="4"/><rect x="508" y="179" width="27" height="31" fill="#beddd0" stroke="none" rx="4"/><rect x="542" y="179" width="27" height="31" fill="#d6e7b9" stroke="none" rx="4"/><text x="633" y="157" fill="#19343b" font-size="17" >顯示真正進入 PCA 的點，不只畫</text><text x="633" y="182" fill="#19343b" font-size="17" >方向箭頭。</text><rect x="21" y="286" width="449" height="185" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="38" y="318" fill="#167a60" font-size="19" >03  特徵值／角度圖</text><path d="M48 431L145 431" stroke="#637774" stroke-width="2" fill="none" /><path d="M48 431L48 348" stroke="#637774" stroke-width="2" fill="none" /><text x="61" y="388" fill="#637774" font-size="14" >待實測</text><text x="164" y="360" fill="#19343b" font-size="17" >接近圓形時主方向不穩；不能硬報</text><text x="164" y="385" fill="#19343b" font-size="17" >精確角度。</text><rect x="490" y="286" width="449" height="185" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="507" y="318" fill="#167a60" font-size="19" >04  逐件規格對照</text><rect x="508" y="345" width="108" height="23" fill="#edf0e9" stroke="none" rx="3"/><text x="516" y="362" fill="#637774" font-size="11" >輸入指紋</text><rect x="508" y="375" width="108" height="23" fill="#edf0e9" stroke="none" rx="3"/><text x="516" y="392" fill="#637774" font-size="11" >參數與版本</text><rect x="508" y="405" width="108" height="23" fill="#edf0e9" stroke="none" rx="3"/><text x="516" y="422" fill="#637774" font-size="11" >全部候選</text><text x="633" y="360" fill="#19343b" font-size="17" >每個 ID 的角度、人工答案與算</text><text x="633" y="385" fill="#19343b" font-size="17" >法答案分開。</text></g></svg>