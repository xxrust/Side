<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><rect width="960" height="520" fill="#f3f2ec"/><g font-family="Heiti TC,PingFang TC,sans-serif"><text x="25" y="34" fill="#19343b" font-size="21" >07 · 彩色零件分揀與混料</text><text x="25" y="60" fill="#637774" font-size="13" >流程示意 · 尚未執行算法 · 無實測分數</text><rect x="20" y="82" width="395" height="328" fill="#ffffff" stroke="#d5ddd6" rx="14"/><circle cx="120" cy="170" r="31" fill="#cc5a4a"/><text x="120" y="176" fill="white" font-size="17" text-anchor="middle">1</text><circle cx="219" cy="170" r="31" fill="#e1b843"/><text x="219" y="176" fill="white" font-size="17" text-anchor="middle">2</text><circle cx="318" cy="170" r="31" fill="#4f8b99"/><text x="318" y="176" fill="white" font-size="17" text-anchor="middle">3</text><circle cx="120" cy="277" r="31" fill="#cc5a4a"/><text x="120" y="283" fill="white" font-size="17" text-anchor="middle">4</text><circle cx="219" cy="277" r="31" fill="#7b70a6"/><text x="219" y="283" fill="white" font-size="17" text-anchor="middle">5</text><circle cx="318" cy="277" r="31" fill="#e1b843"/><text x="318" y="283" fill="white" font-size="17" text-anchor="middle">6</text><text x="88" y="373" fill="#637774" font-size="15" >逐件判色，避免全圖比例誤導</text><rect x="438" y="82" width="501" height="328" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="460" y="119" fill="#637774" font-size="15" >要回答</text><text x="460" y="151" fill="#19343b" font-size="20" >每個零件是哪一種顏色？這批是否混入錯色件？</text><text x="460" y="229" fill="#167a60" font-size="15" >輸出必須能回到原圖</text><text x="460" y="266" fill="#19343b" font-size="17" >01  逐件顏色類別與數量</text><text x="460" y="306" fill="#19343b" font-size="17" >02  顏色範圍內外的像素比例</text><text x="460" y="346" fill="#19343b" font-size="17" >03  未知顏色／強反光的拒絕</text><rect x="21" y="433" width="171" height="66" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="32" y="457" fill="#19343b" font-size="13" >分離逐件區域</text><text x="32" y="477" fill="#637774" font-size="9" >遮罩／輪廓</text><text x="195" y="474" fill="#167a60" font-size="16" >→</text><rect x="209" y="433" width="171" height="66" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="220" y="457" fill="#19343b" font-size="13" >轉到可比較色彩空間</text><text x="220" y="477" fill="#637774" font-size="9" >cvtColor / HSV</text><text x="383" y="474" fill="#167a60" font-size="16" >→</text><rect x="397" y="433" width="171" height="66" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="408" y="457" fill="#19343b" font-size="13" >從示教像素看分布</text><text x="408" y="477" fill="#637774" font-size="9" >H-S 直方圖</text><text x="571" y="474" fill="#167a60" font-size="16" >→</text><rect x="585" y="433" width="171" height="66" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="596" y="457" fill="#19343b" font-size="13" >建立顏色範圍</text><text x="596" y="477" fill="#637774" font-size="9" >inRange</text><text x="759" y="474" fill="#167a60" font-size="16" >→</text><rect x="773" y="433" width="171" height="66" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="784" y="457" fill="#19343b" font-size="13" >逐件分類與混料規則</text><text x="784" y="477" fill="#637774" font-size="9" >數量／UNKNOWN</text></g></svg>