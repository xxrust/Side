<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><rect width="960" height="520" fill="#f3f2ec"/><g font-family="Heiti TC,PingFang TC,sans-serif"><text x="25" y="34" fill="#19343b" font-size="21" >黏連顆粒的分離與計數 · 參數比較規劃</text><text x="25" y="60" fill="#637774" font-size="13" >流程示意 · 尚未執行算法 · 無實測分數</text><rect x="22" y="84" width="420" height="362" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="43" y="119" fill="#167a60" font-size="19" >比較網格示意</text><text x="43" y="148" fill="#637774" font-size="13" >第三參數另分頁；每格都要保留結果</text><rect x="72" y="181" width="98" height="57" fill="#edf0e9" stroke="#cdd9d0" rx="8"/><text x="121" y="215" fill="#637774" font-size="14" text-anchor="middle">待實算</text><rect x="184" y="181" width="98" height="57" fill="#edf0e9" stroke="#cdd9d0" rx="8"/><text x="233" y="215" fill="#637774" font-size="14" text-anchor="middle">待實算</text><rect x="296" y="181" width="98" height="57" fill="#edf0e9" stroke="#cdd9d0" rx="8"/><text x="345" y="215" fill="#637774" font-size="14" text-anchor="middle">待實算</text><rect x="72" y="253" width="98" height="57" fill="#edf0e9" stroke="#cdd9d0" rx="8"/><text x="121" y="287" fill="#637774" font-size="14" text-anchor="middle">待實算</text><rect x="184" y="253" width="98" height="57" fill="#edf0e9" stroke="#cdd9d0" rx="8"/><text x="233" y="287" fill="#637774" font-size="14" text-anchor="middle">待實算</text><rect x="296" y="253" width="98" height="57" fill="#edf0e9" stroke="#cdd9d0" rx="8"/><text x="345" y="287" fill="#637774" font-size="14" text-anchor="middle">待實算</text><rect x="72" y="325" width="98" height="57" fill="#edf0e9" stroke="#cdd9d0" rx="8"/><text x="121" y="359" fill="#637774" font-size="14" text-anchor="middle">待實算</text><rect x="184" y="325" width="98" height="57" fill="#edf0e9" stroke="#cdd9d0" rx="8"/><text x="233" y="359" fill="#637774" font-size="14" text-anchor="middle">待實算</text><rect x="296" y="325" width="98" height="57" fill="#edf0e9" stroke="#cdd9d0" rx="8"/><text x="345" y="359" fill="#637774" font-size="14" text-anchor="middle">待實算</text><text x="43" y="428" fill="#637774" font-size="14" >這輪沒有執行比較，沒有虛構勝出者。</text><rect x="468" y="86" width="469" height="60" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="487" y="123" fill="#19343b" font-size="17" >1  完整跑完候選組合</text><rect x="468" y="159" width="469" height="60" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="487" y="196" fill="#19343b" font-size="17" >2  比較真值誤差與漏檢／誤報</text><rect x="468" y="232" width="469" height="60" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="487" y="269" fill="#19343b" font-size="17" >3  檢查線位、數量或分類是否跳變</text><rect x="468" y="305" width="469" height="60" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="487" y="342" fill="#19343b" font-size="17" >4  交代取捨，然後鎖定參數</text><rect x="468" y="378" width="469" height="60" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="487" y="415" fill="#167a60" font-size="17" >5  到未參與調參的樣本上驗收</text><text x="24" y="490" fill="#637774" font-size="15" >右側列的是試驗候選與來源；所有門檻仍需依樣品、成像和規格確認。</text></g></svg>