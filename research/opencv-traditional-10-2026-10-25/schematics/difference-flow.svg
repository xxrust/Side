<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520"><rect width="960" height="520" fill="#f3f2ec"/><g font-family="Heiti TC,PingFang TC,sans-serif"><text x="25" y="34" fill="#19343b" font-size="21" >09 · 印刷件配準後的缺印／異物</text><text x="25" y="60" fill="#637774" font-size="13" >流程示意 · 尚未執行算法 · 無實測分數</text><rect x="20" y="82" width="395" height="328" fill="#ffffff" stroke="#d5ddd6" rx="14"/><rect x="73" y="115" width="287" height="215" fill="#deebe2" stroke="#167a60" rx="14"/><path d="M100 153L330 153" stroke="#376f96" stroke-width="2" fill="none" /><path d="M100 190L330 190" stroke="#376f96" stroke-width="2" fill="none" /><path d="M100 227L330 227" stroke="#376f96" stroke-width="2" fill="none" /><path d="M100 264L330 264" stroke="#376f96" stroke-width="2" fill="none" /><rect x="201" y="175" width="35" height="31" fill="#f0d6ce" stroke="#b75443" rx="0"/><text x="81" y="373" fill="#637774" font-size="15" >先核對位移，再比較缺陷像素</text><rect x="438" y="82" width="501" height="328" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="460" y="119" fill="#637774" font-size="15" >要回答</text><text x="460" y="151" fill="#19343b" font-size="20" >這一小塊是缺印，還是只是圖像沒對準？</text><text x="460" y="229" fill="#167a60" font-size="15" >輸出必須能回到原圖</text><text x="460" y="266" fill="#19343b" font-size="17" >01  配準變換與有效區</text><text x="460" y="306" fill="#19343b" font-size="17" >02  差分熱圖／缺陷區域</text><text x="460" y="346" fill="#19343b" font-size="17" >03  缺陷位置、面積與分項判定</text><rect x="21" y="433" width="171" height="66" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="32" y="457" fill="#19343b" font-size="13" >固定良品與檢查區</text><text x="32" y="477" fill="#637774" font-size="9" >基準圖／ROI</text><text x="195" y="474" fill="#167a60" font-size="16" >→</text><rect x="209" y="433" width="171" height="66" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="220" y="457" fill="#19343b" font-size="13" >估計小位姿變化</text><text x="220" y="477" fill="#637774" font-size="9" >findTransformECC</text><text x="383" y="474" fill="#167a60" font-size="16" >→</text><rect x="397" y="433" width="171" height="66" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="408" y="457" fill="#19343b" font-size="13" >保留有效重疊像素</text><text x="408" y="477" fill="#637774" font-size="9" >warp／valid mask</text><text x="571" y="474" fill="#167a60" font-size="16" >→</text><rect x="585" y="433" width="171" height="66" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="596" y="457" fill="#19343b" font-size="13" >計算差異與缺陷區</text><text x="596" y="477" fill="#637774" font-size="9" >absdiff／局部門檻</text><text x="759" y="474" fill="#167a60" font-size="16" >→</text><rect x="773" y="433" width="171" height="66" fill="#ffffff" stroke="#d5ddd6" rx="14"/><text x="784" y="457" fill="#19343b" font-size="13" >對照真缺陷標註</text><text x="784" y="477" fill="#637774" font-size="9" >區域規格／UNKNOWN</text></g></svg>